<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create your Evently account.">
    <title>Create account | Evently</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="login.css">
</head>

<body class="auth-page register-page">

    <main class="auth-shell">

        <section class="auth-content">

            <div class="auth-form-wrap">

                <a class="auth-back" href="index.html">
                    &larr; Back to home
                </a>

                <p class="eyebrow">Create your account</p>

                <h2>Let’s get you out there.</h2>

                <p class="auth-intro">
                    Sign up free and save the events you never want to miss.
                </p>

                <form class="auth-form" id="registerForm">

                    <!-- FULL NAME -->
                    <label for="name">Full name</label>

                    <input
                        id="name"
                        name="name"
                        type="text"
                        autocomplete="name"
                        placeholder="Your name"
                        required
                    >

                    <!-- EMAIL -->
                    <label for="email">Email address</label>

                    <input
                        id="email"
                        name="email"
                        type="email"
                        autocomplete="email"
                        placeholder="you@example.com"
                        required
                    >

                    <!-- ROLE -->
                    <label for="role">Select role</label>

                    <select
                        id="role"
                        name="role"
                        required
                    >
                        <option value="" selected disabled>
                            Choose your role
                        </option>

                        <option value="ADMIN">
                            Admin
                        </option>

                        <option value="ORGANIZER">
                            Organizer
                        </option>

                        <option value="ATTENDEE">
                            Attendee
                        </option>
                    </select>

                    <!-- PASSWORD LABEL -->
                    <div class="auth-label-row">

                        <label for="password">
                            Password
                        </label>

                        <span class="password-hint">
                            8+ characters
                        </span>

                    </div>

                    <!-- PASSWORD -->
                    <div class="password-field">

                        <input
                            id="password"
                            name="password"
                            type="password"
                            autocomplete="new-password"
                            placeholder="Create a password"
                            minlength="8"
                            required
                        >

                        <button
                            class="password-toggle"
                            type="button"
                            id="passwordToggle"
                        >
                            Show
                        </button>

                    </div>

                    <!-- TERMS -->
                    <label class="remember-me">

                        <input
                            type="checkbox"
                            required
                        >

                        <span>
                            I agree to the Evently terms and privacy policy.
                        </span>

                    </label>

                    <!-- SUBMIT -->
                    <button
                        class="btn btn-primary auth-submit"
                        type="submit"
                    >
                        Create account
                    </button>

                </form>

                <!-- ERROR MESSAGE -->
                <p
                    class="auth-error"
                    id="registerError"
                    role="alert"
                ></p>

                <!-- LOGIN -->
                <p class="auth-register">
                    Already have an account?
                    <a href="login.html">
                        Log in
                    </a>
                </p>

            </div>

        </section>

    </main>

    <div
        class="toast"
        id="toast"
        role="status"
    ></div>


    <script>

        // ==========================================
        // REGISTER FORM
        // ==========================================

        const registerForm =
            document.getElementById('registerForm');

        const toast =
            document.getElementById('toast');

        const error =
            document.getElementById('registerError');


        // ==========================================
        // REGISTER SUBMIT
        // ==========================================

        registerForm.addEventListener(
            'submit',
            async (event) => {

                event.preventDefault();

                // Hide old error
                error.style.display = 'none';
                error.textContent = '';


                // ==========================================
                // GET USER DATA
                // ==========================================

                const user = {

                    name:
                        document
                            .getElementById('name')
                            .value
                            .trim(),

                    email:
                        document
                            .getElementById('email')
                            .value
                            .trim()
                            .toLowerCase(),

                    password:
                        document
                            .getElementById('password')
                            .value,

                    role:
                        document
                            .getElementById('role')
                            .value
                };


                // ==========================================
                // BASIC VALIDATION
                // ==========================================

                if (!user.name) {

                    error.textContent =
                        'Please enter your full name.';

                    error.style.display = 'block';

                    return;
                }


                if (!user.email) {

                    error.textContent =
                        'Please enter your email address.';

                    error.style.display = 'block';

                    return;
                }


                if (!user.role) {

                    error.textContent =
                        'Please select a role.';

                    error.style.display = 'block';

                    return;
                }


                if (user.password.length < 8) {

                    error.textContent =
                        'Password must contain at least 8 characters.';

                    error.style.display = 'block';

                    return;
                }


                // ==========================================
                // SEND REQUEST TO RAILWAY BACKEND
                // ==========================================

                try {

                    const apiBase = window.EVENTLY_API_BASE ||
                        (['localhost', '127.0.0.1'].includes(window.location.hostname)
                            ? 'http://localhost:8080'
                            : 'https://evently-production-b57e.up.railway.app');

                    const response = await fetch(
                        `${apiBase}/api/auth/register`,
                        {
                            method: 'POST',

                            headers: {
                                'Content-Type':
                                    'application/json'
                            },

                            body:
                                JSON.stringify(user)
                        }
                    );


                    // ==========================================
                    // READ RESPONSE SAFELY
                    // ==========================================

                    const responseText =
                        await response.text();


                    let result = {};


                    // Backend may return JSON
                    // OR plain text
                    // OR empty response

                    if (responseText.trim()) {

                        try {

                            result =
                                JSON.parse(responseText);

                        } catch (jsonError) {

                            result = {
                                message:
                                    responseText
                            };
                        }
                    }


                    // ==========================================
                    // HANDLE ERROR RESPONSE
                    // ==========================================

                    if (!response.ok) {

                        throw new Error(

                            result.detail ||

                            result.message ||

                            result.error ||

                            responseText ||

                            `Registration failed (${response.status})`
                        );
                    }


                    // ==========================================
                    // SAVE USER RESPONSE
                    // ==========================================

                    localStorage.setItem(
                        'eventlyUser',
                        JSON.stringify(result)
                    );


                    // ==========================================
                    // SUCCESS
                    // ==========================================

                    error.style.display = 'none';

                    toast.textContent =
                        'Account created. Redirecting to login.';

                    toast.classList.add('show');


                    setTimeout(() => {

                        window.location.href =
                            'login.html';

                    }, 1400);


                } catch (failure) {

                    // ==========================================
                    // SHOW ERROR
                    // ==========================================

                    error.textContent =
                        failure.message ||
                        'Could not connect to the Evently server.';

                    error.style.display = 'block';

                }

            }
        );


        // ==========================================
        // PASSWORD SHOW / HIDE
        // ==========================================

        document
            .getElementById('passwordToggle')
            .addEventListener(
                'click',
                (event) => {

                    const password =
                        document.getElementById('password');

                    const showPassword =
                        password.type === 'password';


                    password.type =
                        showPassword
                            ? 'text'
                            : 'password';


                    event.currentTarget.textContent =
                        showPassword
                            ? 'Hide'
                            : 'Show';
                }
            );

    </script>

</body>
</html>
