<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User management | Evently Admin</title>
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="admin-pages.css">
</head>
<body>
<div class="dashboard-shell">
        <aside class="sidebar">
            <a class="dashboard-logo" href="index.html"><img src="logo.png" alt="Evently"> Evently</a>
            <p class="sidebar-label">Admin menu</p>
            <a class="sidebar-link" href="admin-dashboard.html">Overview</a>
            <a class="sidebar-link" href="admin-users.html">User management</a>
            <a class="sidebar-link" href="admin-approvals.html">Event approvals</a>
            <a class="sidebar-link" href="admin-settings.html">Settings</a>
            <a class="sidebar-link" href="admin-activity.html">Activity log</a>
            <a class="sidebar-link" href="admin-reports.html">Reports</a>
            <a class="sidebar-link logout" href="login.html" data-logout>Log out</a>
        </aside>
    <main class="dashboard-main">
        <header class="dashboard-header"><div><span class="dashboard-eyebrow">Admin dashboard</span><h1>Run the room.</h1><p class="dashboard-subtitle">Keep Evently welcoming, useful, and moving.</p></div><div class="profile-chip"><span class="profile-dot"></span><span data-user-name>Admin</span></div></header>
        <div class="admin-grid single-admin-page">
            <section
                class="dashboard-panel admin-panel"
                id="users"
            >

                <div class="panel-heading">

                    <div>

                        <span class="panel-kicker">
                            User management
                        </span>

                        <h2>
                            People on Evently
                        </h2>

                    </div>

                    <button
                        class="admin-action"
                        id="addUserButton"
                        type="button"
                    >
                        + Add user
                    </button>

                </div>


                <div class="table-wrap">

                    <table class="admin-table">

                        <thead>

                            <tr>

                                <th>
                                    Name
                                </th>

                                <th>
                                    Role
                                </th>

                                <th>
                                    Status
                                </th>

                                <th>
                                    Action
                                </th>

                            </tr>

                        </thead>


                        <tbody id="userTable">

                            <!-- JavaScript will load users -->

                        </tbody>

                    </table>

                </div>


                <!-- USER FORM -->

                <form
                    class="user-editor"
                    id="userEditor"
                    style="display:none;"
                >

                    <div class="editor-heading">

                        <strong id="editorTitle">
                            Add user
                        </strong>

                        <button
                            class="close-editor"
                            id="closeEditor"
                            type="button"
                        >
                            Close
                        </button>

                    </div>


                    <input
                        id="userEditIndex"
                        type="hidden"
                    >


                    <label>
                        Name

                        <input
                            id="userName"
                            type="text"
                            placeholder="Full name"
                            required
                        >

                    </label>

                    <label id="userPasswordLabel">
                        Initial password
                        <input id="userPassword" type="password" minlength="8" autocomplete="new-password" placeholder="At least 8 characters">
                    </label>


                    <label>
                        Email

                        <input
                            id="userEmail"
                            type="email"
                            placeholder="email@example.com"
                            required
                        >

                    </label>


                    <label>
                        Assign role

                        <select
                            id="userRole"
                            required
                        >

                            <option value="ADMIN">
                                ADMIN
                            </option>

                            <option value="ORGANIZER">
                                ORGANIZER
                            </option>

                            <option
                                value="ATTENDEE"
                                selected
                            >
                                ATTENDEE
                            </option>

                        </select>

                    </label>


                    <button
                        class="admin-action"
                        type="submit"
                    >
                        Save user
                    </button>

                </form>


                <p
                    class="admin-confirmation"
                    id="userConfirmation"
                    role="status"
                ></p>

            </section>
        </div>
    </main>
</div>
<script src="api-client.js"></script><script src="admin-pages.js"></script>
<!-- <script src="api-client.js"></script><script src="dashboard.js"></script> -->
</body>
</html>
