<head>
    <meta charset="UTF-8">

<body>
<div class="dashboard-shell">
        <aside class="sidebar">
            <a class="dashboard-logo" href="index.html"><img src="logo.png" alt="Evently"> Evently</a>
            <p class="sidebar-label">Admin menu</p>
            <a class="sidebar-link" href="admin-dashboard.html">Overview</a>
